    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    sourceSets {
        main {
            res {
                srcDirs = [
                        'src/main/res',
                        'src/main/res/layouts/ispbooster',
                        'src/main/res/layouts/ispdigital',
                        'src/main/res/layouts/adminEmployee'
                ]
            }
        }
    }


    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }


    dependencies {
        implementation project(path: ':ispdigitalapi')
        implementation files('libs/mikrotikapi.jar')
        // implementation project(path: ':fosterpaymentslibrary')

        // Define versions and dependencies
        def material_version = '1.12.0'

        // Core dependencies
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation "com.google.android.material:material:$material_version"
        implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
        implementation 'androidx.navigation:navigation-fragment:2.8.3'
        implementation 'androidx.navigation:navigation-ui:2.8.3'
        implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
        implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
        implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
        implementation 'androidx.legacy:legacy-support-v4:1.0.0'
        testImplementation 'junit:junit:4.13.2'
        androidTestImplementation 'androidx.test.ext:junit:1.2.1'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

        // Butterknife for view binding
//    implementation 'com.jakewharton:butterknife:10.2.1'
//    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'

        // Network dependencies
        implementation 'com.squareup.retrofit2:retrofit:2.9.0'
        implementation "com.squareup.okhttp3:okhttp:4.9.0"
        implementation "com.squareup.okhttp3:logging-interceptor:4.9.0"
        implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

        // WorkManager
        implementation "androidx.work:work-runtime:2.10.0"

        // Glide for image loading
        implementation 'com.github.bumptech.glide:glide:4.11.0'
        annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

        // Additional libraries
        implementation 'com.github.florent37:expansionpanel:1.2.4'
        implementation 'com.github.vipulasri:timelineview:1.1.5'
        implementation 'com.microsoft.signalr:signalr:1.0.0'
        implementation 'com.facebook.shimmer:shimmer:0.1.0@aar'
        implementation 'com.airbnb.android:lottie:5.2.0'
        implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.19'
        implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
        implementation 'com.github.mukeshsolanki:MarkdownView-Android:1.0.8'
        implementation 'com.github.MikeOrtiz:TouchImageView:3.0.1'

        // Dagger for dependency injection
        implementation 'com.google.dagger:dagger:2.35.1'
        implementation 'com.google.dagger:dagger-android:2.35.1'
        annotationProcessor 'com.google.dagger:dagger-android-processor:2.28'
        annotationProcessor 'com.google.dagger:dagger-compiler:2.28'

        // Google Play Core Library
        implementation 'com.google.android.play:app-update:2.1.0'

        // Picasso for image loading
        implementation 'com.squareup.picasso:picasso:2.71828'
        implementation 'com.google.android.gms:play-services-location:21.3.0'
        implementation 'com.google.maps.android:android-maps-utils:0.5+'


        // Iconics for fonts and icons
        implementation "com.mikepenz:iconics-core:3.2.5"
        implementation "com.mikepenz:iconics-views:3.2.5"

        // Other dependencies
        implementation 'commons-io:commons-io:2.6'
        implementation "androidx.paging:paging-runtime-ktx:3.3.2"
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'com.github.mthli:SugarTask:v0.4'
        implementation 'org.jsoup:jsoup:1.13.1'
        implementation 'np.com.susanthapa:curved_bottom_navigation:0.6.5'
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.6.4"
        androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
        implementation 'jp.wasabeef:richeditor-android:2.0.0'
        implementation "androidx.work:work-runtime:2.10.0"


        //updated dependencies
        implementation 'io.github.chaosleung:pinview:1.4.4'
        implementation 'io.github.rupinderjeet:kprogresshud:1.0.0'
        implementation 'com.github.lichao3140:GifDialog:1.0.1'
        implementation 'com.github.javaherisaber:android-material-stepper:5.0.1'
        implementation 'com.jjoe64:graphview:4.2.2'
        implementation 'com.github.delight-im:Android-AdvancedWebView:v3.2.1'
        implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.3.0'

        //Payment Gateways
        implementation 'com.github.aamarpay-dev:aamarPay-Android-Library:1.1'
        implementation 'com.razorpay:checkout:1.6.33'
        implementation 'phonepe.intentsdk.android.release:IntentSDK:2.4.3'
        implementation(name: 'sslcommerzlibrary', ext: 'aar')


        implementation 'com.google.firebase:firebase-messaging:24.0.3'
        implementation 'com.squareup:android-times-square:1.6.5@aar'
        implementation 'com.github.swapnil1104:CurveGraphView:1.1.3'

    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}